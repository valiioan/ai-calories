services:
  nginx:
    image: nginx:1.28-alpine
    container_name: calorai-nginx
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      php:
        condition: service_healthy
      node:
        condition: service_healthy
    restart: unless-stopped

  php:
    build:
      context: ./docker/php
    container_name: calorai-php
    volumes:
      - ./backend:/var/www/html
    environment:
      DB_HOST: mysql
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 180s
    restart: unless-stopped

  node:
    image: node:24-bookworm
    container_name: calorai-node
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    environment:
      DOCKER: "1"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 120s
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: calorai-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: calorai
      MYSQL_USER: calorai
      MYSQL_PASSWORD: calorai
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - calorai-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ucalorai", "-pcalorai"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

volumes:
  calorai-mysql:
  frontend-node-modules:
